{{ define "main" }}
  <header>
    <h1>{{ .Title }}</h1>
    {{ with .Params.subtitle }}<span class="subtitle">{{ partial "smallcaps.html" (. | htmlEscape) }}</span>{{ end }}
  </header>
  {{ .Content }}
  {{ partial "post-list.html" (where site.RegularPages "Section" "posts").ByDate.Reverse }}
{{ end }}
